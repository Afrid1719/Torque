name: Pull Request Checks

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      APP_NAME: TORQUE API
      APP_ENV: testing
      DEBUG: "false"
      API_V1_PREFIX: /api/v1
      JWT_SECRET_KEY: torque_ci_only_jwt_secret_key_32_chars
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: torque_ci
      MYSQL_USER: torque_ci
      MYSQL_PASSWORD: torque_ci_password
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js for Pyright
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify FastAPI app import
        run: python -c "from app.main import app; print(app.title)"

      - name: Run backend lint
        run: python -m ruff check .

      - name: Check backend formatting
        run: python -m ruff format --check .

      - name: Run backend type checking
        run: python -m pyright --pythonpath "$(which python)" app

      - name: Run backend tests with coverage
        run: python -m pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint (rejects explicit any)
        run: npm run lint

      - name: Check frontend formatting
        run: npm run format:check

      - name: Run frontend type checking
        run: npm run typecheck

      - name: Run frontend tests with coverage
        run: npm test

      - name: Build frontend
        run: npm run build
