[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
    ".venv",
    "migrations/versions",
]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
]
ignore = [
    "B008",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
